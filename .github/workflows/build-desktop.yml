name: Build and release Harbor

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win:release
            artifact: Harbor-Windows
          - os: ubuntu-latest
            command: npm run dist:linux
            artifact: Harbor-Linux
          - os: macos-latest
            command: npm run dist:mac
            artifact: Harbor-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure private catalog access
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/configure-build.cjs --desktop --require

      - name: Run static regression suite
        run: npm test

      - name: Configure optional signing credentials
        shell: bash
        env:
          HARBOR_CSC_LINK: ${{ secrets.CSC_LINK }}
          HARBOR_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          HARBOR_APPLE_ID: ${{ secrets.APPLE_ID }}
          HARBOR_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HARBOR_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$HARBOR_CSC_LINK" ]]; then
            printf 'CSC_LINK=%s\n' "$HARBOR_CSC_LINK" >> "$GITHUB_ENV"
            if [[ -n "$HARBOR_CSC_KEY_PASSWORD" ]]; then
              printf 'CSC_KEY_PASSWORD=%s\n' "$HARBOR_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            fi
          fi
          if [[ -n "$HARBOR_APPLE_ID" && -n "$HARBOR_APPLE_APP_SPECIFIC_PASSWORD" && -n "$HARBOR_APPLE_TEAM_ID" ]]; then
            printf 'APPLE_ID=%s\n' "$HARBOR_APPLE_ID" >> "$GITHUB_ENV"
            printf 'APPLE_APP_SPECIFIC_PASSWORD=%s\n' "$HARBOR_APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            printf 'APPLE_TEAM_ID=%s\n' "$HARBOR_APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: Build native downloads
        run: ${{ matrix.command }}

      - name: Upload native downloads
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/*.AppImage
            release/*.tar.gz
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  tv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install dependencies
        run: npm ci

      - name: Stage TV clients
        run: npm run tv:stage

      - name: Package LG webOS client
        run: npx --yes --package @webos-tools/cli@3.2.5 ares-package tv/build/lg -o tv/release

      - name: Build Android and Fire TV APK
        run: gradle -p tv/android :app:assembleRelease

      - name: Name TV downloads
        run: |
          mv tv/release/com.harbor.tv_2.0.0_all.ipk tv/release/Harbor-TV-LG-webOS-2.0.0.ipk
          cp tv/android/app/build/outputs/apk/release/app-release.apk tv/release/Harbor-TV-Android-Fire-2.0.0.apk

      - name: Upload TV downloads
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-TV
          path: |
            tv/release/*.ipk
            tv/release/*.apk
            tv/release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all native builds
        uses: actions/download-artifact@v4
        with:
          pattern: Harbor-*
          path: release-assets
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --title "Harbor ${GITHUB_REF_NAME#v}"
          fi

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Stage download site
        run: |
          mkdir -p _site/assets _site/tv
          cp index.html _site/index.html
          cp assets/harbor-mark.svg assets/icon.png _site/assets/
          cp tv/index.html tv/config.js tv/tv.css tv/tv.js _site/tv/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
