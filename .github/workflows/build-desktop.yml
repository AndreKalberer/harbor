name: Build and release Harbor

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag and package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win:release
            artifact: Harbor-Windows
          - os: ubuntu-latest
            command: npm run dist:linux
            artifact: Harbor-Linux
          - os: macos-latest
            command: npm run dist:mac
            artifact: Harbor-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure private catalog access
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            node scripts/configure-build.cjs --desktop
          else
            node scripts/configure-build.cjs --desktop --require
          fi

      - name: Run static regression suite
        run: npm test

      - name: Run isolated desktop consumer smoke suite
        if: runner.os == 'Windows'
        run: npm run test:desktop-smoke

      - name: Run isolated TV remote-navigation smoke suite
        if: runner.os == 'Windows'
        run: npm run test:tv-smoke

      - name: Configure optional signing credentials
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          HARBOR_APPLE_ID: ${{ secrets.APPLE_ID }}
          HARBOR_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HARBOR_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "${RUNNER_OS}" == "Windows" && -n "${WIN_CSC_LINK}" ]]; then
            printf 'CSC_LINK=%s\n' "${WIN_CSC_LINK}" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "${WIN_CSC_KEY_PASSWORD}" >> "$GITHUB_ENV"
          elif [[ "${RUNNER_OS}" == "macOS" && -n "${MAC_CSC_LINK}" ]]; then
            printf 'CSC_LINK=%s\n' "${MAC_CSC_LINK}" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "${MAC_CSC_KEY_PASSWORD}" >> "$GITHUB_ENV"
          fi
          if [[ -n "$HARBOR_APPLE_ID" && -n "$HARBOR_APPLE_APP_SPECIFIC_PASSWORD" && -n "$HARBOR_APPLE_TEAM_ID" ]]; then
            printf 'APPLE_ID=%s\n' "$HARBOR_APPLE_ID" >> "$GITHUB_ENV"
            printf 'APPLE_APP_SPECIFIC_PASSWORD=%s\n' "$HARBOR_APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            printf 'APPLE_TEAM_ID=%s\n' "$HARBOR_APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: Require signing for tagged desktop releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          HARBOR_APPLE_ID: ${{ secrets.APPLE_ID }}
          HARBOR_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HARBOR_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "${RUNNER_OS}" == "Windows" && ( -z "${WIN_CSC_LINK}" || -z "${WIN_CSC_KEY_PASSWORD}" ) ]]; then
            echo "Windows signing credentials are required for a tagged release." >&2
            exit 1
          fi
          if [[ "${RUNNER_OS}" == "macOS" && ( -z "${MAC_CSC_LINK}" || -z "${MAC_CSC_KEY_PASSWORD}" || -z "${HARBOR_APPLE_ID}" || -z "${HARBOR_APPLE_APP_SPECIFIC_PASSWORD}" || -z "${HARBOR_APPLE_TEAM_ID}" ) ]]; then
            echo "macOS signing and notarization credentials are required for a tagged release." >&2
            exit 1
          fi

      - name: Build native downloads
        run: ${{ matrix.command }}

      - name: Smoke-test packaged Windows app
        if: runner.os == 'Windows'
        run: npm run test:packaged-smoke

      - name: Upload native downloads
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
            release/latest-linux.yml
            release/*.AppImage
            release/*.tar.gz
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  tv:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install dependencies
        run: npm ci

      - name: Configure TV catalog access
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            node scripts/configure-build.cjs --tv
          else
            node scripts/configure-build.cjs --tv --require
          fi

      - name: Stage TV clients
        run: npm run tv:stage

      - name: Package LG webOS client
        run: npx --yes --package @webos-tools/cli@3.2.5 ares-package tv/build/lg -o tv/release

      - name: Configure Android release signing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          HARBOR_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          HARBOR_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          HARBOR_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HARBOR_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${HARBOR_ANDROID_KEYSTORE_BASE64}" || -z "${HARBOR_ANDROID_STORE_PASSWORD}" || -z "${HARBOR_ANDROID_KEY_ALIAS}" || -z "${HARBOR_ANDROID_KEY_PASSWORD}" ]]; then
            echo "Android signing credentials are required for a tagged release." >&2
            exit 1
          fi
          printf '%s' "${HARBOR_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/harbor-release.jks"
          printf 'HARBOR_ANDROID_KEYSTORE=%s\n' "${RUNNER_TEMP}/harbor-release.jks" >> "${GITHUB_ENV}"
          printf 'HARBOR_ANDROID_STORE_PASSWORD=%s\n' "${HARBOR_ANDROID_STORE_PASSWORD}" >> "${GITHUB_ENV}"
          printf 'HARBOR_ANDROID_KEY_ALIAS=%s\n' "${HARBOR_ANDROID_KEY_ALIAS}" >> "${GITHUB_ENV}"
          printf 'HARBOR_ANDROID_KEY_PASSWORD=%s\n' "${HARBOR_ANDROID_KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Build Android and Fire TV APK
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            gradle -p tv/android :app:assembleRelease
          else
            gradle -p tv/android :app:assembleDebug
          fi

      - name: Name TV downloads
        shell: bash
        run: |
          HARBOR_VERSION="$(node -p "require('./package.json').version")"
          mv "tv/release/com.harbor.tv_${HARBOR_VERSION}_all.ipk" "tv/release/Harbor-TV-LG-webOS-${HARBOR_VERSION}.ipk"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APK_PATH="tv/android/app/build/outputs/apk/release/app-release.apk"
          else
            APK_PATH="tv/android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "${APK_PATH}" "tv/release/Harbor-TV-Android-Fire-${HARBOR_VERSION}.apk"

      - name: Upload TV downloads
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-TV
          path: |
            tv/release/*.ipk
            tv/release/*.apk
            tv/release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all native builds
        uses: actions/download-artifact@v4
        with:
          pattern: Harbor-*
          path: release-assets
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --title "Harbor ${GITHUB_REF_NAME#v}" --repo "${GITHUB_REPOSITORY}"
          fi

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install runtime dependencies
        run: npm ci

      - name: Configure TV catalog access
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            node scripts/configure-build.cjs --tv
          else
            node scripts/configure-build.cjs --tv --require
          fi

      - name: Stage download site
        run: |
          mkdir -p _site/assets _site/shared _site/tv _site/node_modules/hls.js/dist
          cp index.html _site/index.html
          cp assets/harbor-mark.svg assets/icon.png _site/assets/
          cp shared/series-metadata.js shared/watch-browse.js _site/shared/
          cp node_modules/hls.js/dist/hls.min.js _site/node_modules/hls.js/dist/
          cp tv/index.html tv/config.js tv/tv.css tv/tv.js _site/tv/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
