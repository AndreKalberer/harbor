<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src https:; media-src https: blob:; frame-src https:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Harbor TV</title>
    <link rel="icon" href="../assets/icon.png" />
    <link rel="stylesheet" href="tv.css" />
  </head>
  <body>
    <div class="tv-shell">
      <header class="tv-header">
        <a class="tv-brand focusable" href="#" data-action="watch"><img src="../assets/harbor-mark.svg" alt="" /><span>Harbor</span></a>
        <div class="tv-header-actions"><button id="search-button" class="round-button focusable" type="button" aria-label="Search">⌕</button><button id="list-button" class="text-button focusable" type="button">My Harbor</button></div>
      </header>

      <main>
        <section id="hero" class="tv-hero"><div class="tv-hero-copy"><p id="hero-kicker" class="eyebrow">Tonight on Harbor</p><h1 id="hero-title">Everything worth watching.</h1><p id="hero-summary">Movies, series, anime, sports, and live television—built for your remote.</p><div class="hero-actions"><button id="hero-play" class="primary-button focusable" type="button">▶ Open</button><button id="hero-save" class="secondary-button focusable" type="button">＋ My List</button></div></div></section>
        <section class="browse-shell"><div id="subcategory-row" class="subcategory-row" aria-label="Categories"></div><div id="watch-filter-row" class="watch-filter-row" aria-label="Browse the selected Watch category" hidden></div><div class="row-heading"><div><p id="row-kicker" class="eyebrow">Featured</p><h2 id="row-title">Popular right now</h2></div><p id="result-count" aria-live="polite"></p></div><div id="card-grid" class="card-grid" aria-live="polite"></div><button id="more-button" class="more-button focusable" type="button" hidden>Show more</button></section>
      </main>

      <div id="search-panel" class="overlay" hidden><section class="search-panel" role="dialog" aria-modal="true" aria-labelledby="search-title"><p class="eyebrow">Search the current section</p><h2 id="search-title">What are you looking for?</h2><form id="search-form"><label class="sr-only" for="search-input">Search the current category</label><input id="search-input" class="focusable" type="search" autocomplete="off" placeholder="Search Harbor" /><button class="primary-button focusable" type="submit">Search</button></form><button class="close-button focusable" type="button" data-close="search">Back</button></section></div>
      <div id="detail-panel" class="overlay" hidden><section class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title"><p id="detail-kicker" class="eyebrow"></p><h2 id="detail-title"></h2><p id="detail-meta" class="detail-meta"></p><p id="detail-summary"></p><div id="episode-browser" class="episode-browser" hidden><label for="season-select">Season</label><select id="season-select" class="focusable"></select><p id="episode-caption" class="episode-caption"></p><div id="episode-grid" class="episode-grid" aria-label="Episodes"></div><div class="episode-page-actions"><button id="episode-previous" class="secondary-button focusable" type="button">Previous episodes</button><button id="episode-next" class="secondary-button focusable" type="button">Next episodes</button></div></div><div class="detail-actions"><button id="detail-play" class="primary-button focusable" type="button">▶ Play</button><button id="detail-save" class="secondary-button focusable" type="button">＋ My List</button><button class="close-button focusable" type="button" data-close="detail">Back</button></div></section></div>
      <div id="player-panel" class="player-panel" hidden><header><div><p class="eyebrow">Now playing</p><h2 id="player-title"></h2><p id="player-episode-label" class="player-episode-label"></p></div><button id="player-back" class="close-button focusable" type="button" data-close="player">Back</button></header><div id="player-stage" class="player-stage"><div id="player-status" role="status" aria-live="polite"><span class="player-loading-mark"><img src="../assets/harbor-mark.svg" alt="" /></span><p class="eyebrow">Harbor</p><h3 id="player-status-title">Getting it ready…</h3><p id="player-status-detail">Player controls will take over automatically.</p><button id="player-retry" class="secondary-button focusable" type="button" hidden>Try again</button></div><iframe id="tv-frame" class="player-frame focusable" title="Playback controls" aria-label="Playback controls" allow="autoplay; fullscreen; encrypted-media" referrerpolicy="no-referrer" tabindex="0" hidden></iframe><video id="tv-video" class="focusable" controls autoplay tabindex="0" hidden></video><audio id="tv-audio" autoplay hidden></audio></div></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
    <script src="../shared/series-metadata.js"></script>
    <script src="../shared/watch-browse.js"></script>
    <script src="config.js"></script>
    <script src="../node_modules/hls.js/dist/hls.min.js"></script>
    <script src="tv.js"></script>
  </body>
</html>
